<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board · 12×18in poster</title>
    <style>
      @font-face {
        font-family: "Kranky";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(data:font/woff2;base64,__KRANKY_B64__) format("woff2");
      }
      :root {
        --bg: #e8d8a8; /* darker papyrus surrounding the page */
        --paper: #f5e8c4; /* lighter papyrus paper background */
        --ink: #111111;
        --red: #e31d1d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        min-height: 100vh;
      }
      body {
        display: grid;
        place-items: start center;
        padding: 28px 16px 80px;
        background-image:
          radial-gradient(circle at 15% 5%, rgba(120, 80, 30, 0.06), transparent 35%),
          radial-gradient(circle at 90% 95%, rgba(60, 40, 10, 0.05), transparent 45%);
      }
      .meta {
        width: min(96vw, 600px);
        margin-bottom: 14px;
        font-size: 11px;
        color: #666;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .meta strong {
        color: var(--ink);
        letter-spacing: 0;
        text-transform: none;
        font-weight: 600;
      }
      .stage {
        /* 12 x 18 inch aspect ratio */
        width: min(96vw, calc((100vh - 140px) * 12 / 18));
        aspect-ratio: 12 / 18;
        background: var(--paper);
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, 0.18),
          0 8px 20px -8px rgba(0, 0, 0, 0.12);
        border-radius: 4px;
        overflow: hidden;
      }
      svg.board {
        width: 100%;
        height: 100%;
        display: block;
      }
      .controls {
        margin-bottom: 18px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: #555;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .controls .sep {
        color: #bbb;
        padding: 0 2px;
      }
      .controls .grp {
        font-weight: 600;
        color: #777;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 11px;
      }
      .controls + .controls {
        margin-top: 6px;
      }
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        cursor: pointer;
        border-radius: 2px;
      }
      button:hover {
        background: var(--ink);
        color: var(--paper);
      }
      input[type="range"] {
        accent-color: var(--ink);
        width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="meta">
      <span>BOARD · 12×18in · 20mm squares</span>
      <strong>plain svg + grain filter</strong>
    </div>

    <div class="controls">
      <button id="reseed">🎲 re-roll</button>
      <button id="export-png">🖼️ export 12×18 png · 300dpi</button>
    </div>

    <div class="stage">
      <svg
        class="board"
        viewBox="0 0 304.8 457.2"
        xmlns="http://www.w3.org/2000/svg"
        id="board"
      ></svg>
    </div>

    <script>
      __SCRIPT__;
    </script>
  </body>
</html>
