      const startFrac = 0.05 + Math.random() * 0.20;
      const startX = cx + dxT * startFrac;
      const startY = cy + dyT * startFrac;

      // Build candidate spine
      const segs = Math.max(2, Math.round(innerSegs * (0.7 + Math.random() * 0.6)));
      // Per-crack jog varies — some are nearly straight, some wander
      const localJog = innerJog * (0.5 + Math.random() * 0.9);
      const s = buildSpine(startX, startY, target[0], target[1], segs, localJog);
      if (!s) continue;

      // Reject if this candidate would cross any existing crack.
      // (No exception — main cracks don't attach to anything yet.)
      if (polylineCrossesPool(s.pts, pool)) continue;

      // Accept: mark vertex, record segments, draw ribbon
      usedVerts.add(vIdx);
      const mainStartIdx = recordPolyline(s.pts, pool);
      innerD += ribbonPath(s.pts, CRACK_BASE_W, 0);

      // ── Branches off this main crack ────────────────────────────
      // 0-2 attempts at first-level branches.  Each succeeds with
      // varying probability.  Branches attach at random points along
      // the ACTUAL JAGGED SPINE (not the start→end line) so the
      // connection visually lands on the parent crack.
      let firstSide = 0;
      for (let ba = 0; ba < 2; ba++) {
        const pBranch = ba === 0 ? 0.60 : 0.35;
        if (Math.random() >= pBranch) continue;

        // Random position along the main crack — walk the actual spine.
        // Bias toward the wider (cell-vertex) half so branches spawn
        // from a thick parent section and end up appropriately sized.
        const branchT = 0.40 + Math.random() * 0.45;
        const along = pointAlongPolyline(s.pts, branchT);
        if (!along) continue;
        const branchBaseX = along.x, branchBaseY = along.y;
        const segOffset = along.segIdx;

        // Side: first branch picks freely; second branch prefers opposite
        let sideSign;
        if (ba === 0) {
          sideSign = Math.random() < 0.5 ? -1 : 1;
          firstSide = sideSign;
        } else {
          sideSign = (Math.random() < 0.70) ? -firstSide : firstSide;
        }
        // Angle relative to local spine tangent (not idealized direction)
        const ldx = along.dirX, ldy = along.dirY;
        const lpx = -ldy,        lpy = ldx;
        const angleFromPerp = (Math.random() - 0.4) * Math.PI * 0.7;
        const cosA = Math.cos(angleFromPerp);
        const sinA = Math.sin(angleFromPerp);
        const bx = (lpx * sideSign) * cosA + ldx * sinA;
        const by = (lpy * sideSign) * cosA + ldy * sinA;
        const blen = Math.hypot(bx, by);
        if (blen < 1e-6) continue;

        const lenRoll = Math.random();
        const lenFrac = 0.20 + Math.pow(lenRoll, 1.7) * 0.55;
        const branchLength = s.len * lenFrac;

        const localW = CRACK_BASE_W * branchT * (0.7 + Math.random() * 0.3);

        growBranch(branchBaseX, branchBaseY,
                   bx / blen, by / blen,
                   -by / blen, bx / blen,
                   branchLength, localW, 0, pool,
                   mainStartIdx + segOffset);
      }
    }
  }
  // Filled crack polygons rendered as a single path — no stroke.
  const innerCrack = document.createElementNS(SVG_NS, 'path');
  innerCrack.setAttribute('d', innerD);
  innerCrack.setAttribute('fill', '#7a5a2a');
  innerCrack.setAttribute('stroke', 'none');
  innerCrack.setAttribute('fill-rule', 'nonzero');
  innerCrack.setAttribute('opacity', '1');
  shapesLayer.appendChild(innerCrack);
}

// Water caustics — implements the "sharp F1 minus smooth F1" Voronoi trick
// from the shader-graph technique:
//   1. Distort UV with a couple sine octaves (stand-in for Musgrave fBM)
//   2. Sharp Voronoi F1 distance field (`d1`)
//   3. Smooth Voronoi F1 distance field (`d2`) using log-sum-exp soft-min
//   4. Edge = d1 - d2  →  bright thin rim wherever cells border each other
//   5. Threshold + smooth-step → crisp caustic line mask
//   6. Mix bright caustic color over water blue using the mask
//
// Rasterized to a hidden <canvas>, then embedded as an SVG <image> so the
// per-pixel math runs once at render time and the result composites with
// the rest of the SVG.
function waterCaustics(x, y, w, h) {
  // Render resolution — 4x the banner dimensions in mm, so each mm has
  // 4 pixels.  Higher = sharper caustics, but more work.  We're in a
  // banner ~285x35mm so this is ~1140x140px = 160k pixels — fast.
  const PX_PER_MM = 4;
  const W = Math.max(1, Math.round(w * PX_PER_MM));
  const H = Math.max(1, Math.round(h * PX_PER_MM));
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const data = img.data;

  // ── Two-layer caustics ──────────────────────────────────────────────
  // 1. UNDER (dark blue): wider, softer, deeper-blue rim.
  // 2. OVER  (bright white): tight, crisp white ridge.
  // Both layers' parameters are baked in (chosen via prior tuning).  Each
  // layer has its own warp strength so they distort independently.
  const layerCfg = {
    blue: {
      count:      50,
      smoothFrac: 0.20,
      thrLo:      0.10,
      thrHi:      1.18,
      warp:       0.018,
      color:      [0x0a, 0x3a, 0x6b],   // dark blue (matches WINDOW_OUTLINE)
    },
    white: {
      count:      25,
      smoothFrac: 0.22,
      thrLo:      0.42,
      thrHi:      1.18,
      warp:       0.010,
      color:      [0xff, 0xff, 0xff],
    },
  };

  // Build a Voronoi field (seeds + grid + smoothness) for one layer.
  function buildField(cfg) {
    const cellSpacing = Math.sqrt((W * H) / cfg.count);
    const minDist = cellSpacing * 0.55;
    const minDistSq = minDist * minDist;
    const seeds = [];
    let attempts = 0;
    const maxAttempts = cfg.count * 80;
    while (seeds.length < cfg.count && attempts < maxAttempts) {
      attempts++;
      const sx = Math.random() * W;
      const sy = Math.random() * H;
      let ok = true;
      for (const [tx, ty] of seeds) {
        const dx = sx - tx, dy = sy - ty;
        if (dx * dx + dy * dy < minDistSq) { ok = false; break; }
      }
      if (ok) seeds.push([sx, sy]);
    }
    const bucketSize = cellSpacing;
    const gridCols = Math.ceil(W / bucketSize) + 1;
    const gridRows = Math.ceil(H / bucketSize) + 1;
    const grid = new Array(gridCols * gridRows);
    for (let i = 0; i < grid.length; i++) grid[i] = [];
    for (const s of seeds) {
      const gx = Math.min(gridCols - 1, Math.floor(s[0] / bucketSize));
      const gy = Math.min(gridRows - 1, Math.floor(s[1] / bucketSize));
      grid[gy * gridCols + gx].push(s);
    }
    return {
      seeds, grid, gridCols, gridRows, bucketSize,
      smoothness: cellSpacing * cfg.smoothFrac,
      thrLo: cfg.thrLo, thrHi: cfg.thrHi,
      color: cfg.color,
      warp: cfg.warp,
    };
  }
  const fieldBlue  = buildField(layerCfg.blue);
  const fieldWhite = buildField(layerCfg.white);

  // UV warp parameters — shared sine phases (so both layers warp from the
  // same noise field) but each layer chooses its OWN amplitude.
  const ph1x = Math.random() * Math.PI * 2;
  const ph1y = Math.random() * Math.PI * 2;
  const ph2x = Math.random() * Math.PI * 2;
  const ph2y = Math.random() * Math.PI * 2;
  function warpUV(px, py, amp) {
    const u = px / W, v = py / H;
    const A1 = amp;
    const A2 = A1 * 0.33;
    const wx =
      Math.sin(u * 8.0 + v * 6.0 + ph1x) * A1 +
      Math.sin(u * 21.0 - v * 11.0 + ph2x) * A2;
    const wy =
      Math.sin(v * 8.0 + u * 6.0 + ph1y) * A1 +
      Math.sin(v * 21.0 - u * 11.0 + ph2y) * A2;
    return [px + wx * W, py + wy * H];
  }

  // Compute the threshold-mask `m` (0..1) for one field at a sample point.
  function fieldMask(field, wux, wuy) {
    const gx = Math.min(field.gridCols - 1, Math.max(0, Math.floor(wux / field.bucketSize)));
    const gy = Math.min(field.gridRows - 1, Math.max(0, Math.floor(wuy / field.bucketSize)));
    let d1 = Infinity;
    let sumExp = 0;
    for (let dy = -2; dy <= 2; dy++) {
      const ggy = gy + dy;
      if (ggy < 0 || ggy >= field.gridRows) continue;
      for (let dx = -2; dx <= 2; dx++) {
        const ggx = gx + dx;
        if (ggx < 0 || ggx >= field.gridCols) continue;
        const bucket = field.grid[ggy * field.gridCols + ggx];
        for (let i = 0; i < bucket.length; i++) {
          const sx = bucket[i][0], sy = bucket[i][1];
          const ddx = wux - sx, ddy = wuy - sy;
          const d = Math.sqrt(ddx * ddx + ddy * ddy);
          if (d < d1) d1 = d;
          sumExp += Math.exp(-d / field.smoothness);
        }
      }
    }
    if (sumExp <= 0) {
      for (let i = 0; i < field.seeds.length; i++) {
        const ddx = wux - field.seeds[i][0], ddy = wuy - field.seeds[i][1];
        const d = Math.sqrt(ddx * ddx + ddy * ddy);
        if (d < d1) d1 = d;
        sumExp += Math.exp(-d / field.smoothness);
      }
    }
    const d2 = -field.smoothness * Math.log(sumExp);
    const edge = (d1 - d2) / field.smoothness;
    let m = (edge - field.thrLo) / (field.thrHi - field.thrLo);
    if (m < 0) m = 0;
    else if (m > 1) m = 1;
    return m * m * (3 - 2 * m);
  }

  // Caustic look parameters
  const WATER_R = 0x3a, WATER_G = 0x91, WATER_B = 0xc2;     // base water blue

  // Per-pixel main loop — composite blue UNDER white.  Each layer warps
  // its UV with its own amplitude so the sliders only affect the blue.
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const cx = px + 0.5, cy = py + 0.5;
      const [bux, buy] = warpUV(cx, cy, fieldBlue.warp);
      const [wux, wuy] = warpUV(cx, cy, fieldWhite.warp);
      const mBlue  = fieldMask(fieldBlue,  bux, buy);
      const mWhite = fieldMask(fieldWhite, wux, wuy);

      // Layer 1: water → dark blue using mBlue
      let r = WATER_R + (fieldBlue.color[0] - WATER_R) * mBlue;
      let g = WATER_G + (fieldBlue.color[1] - WATER_G) * mBlue;
      let b = WATER_B + (fieldBlue.color[2] - WATER_B) * mBlue;
      // Layer 2: that → white using mWhite (so white sits on top)
      r = r + (fieldWhite.color[0] - r) * mWhite;
      g = g + (fieldWhite.color[1] - g) * mWhite;
      b = b + (fieldWhite.color[2] - b) * mWhite;

      const idx = (py * W + px) * 4;
      data[idx]     = r | 0;
      data[idx + 1] = g | 0;
      data[idx + 2] = b | 0;
      data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // Embed the canvas as an SVG <image>.
  const dataURL = canvas.toDataURL('image/png');
  const imgEl = document.createElementNS(SVG_NS, 'image');
  imgEl.setAttribute('x', x);
  imgEl.setAttribute('y', y);
  imgEl.setAttribute('width',  w);
  imgEl.setAttribute('height', h);
  imgEl.setAttribute('preserveAspectRatio', 'none');
  imgEl.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', dataURL);
  imgEl.setAttribute('href', dataURL);
  shapesLayer.appendChild(imgEl);
}

// Continuous wavy ground: a single shape spanning the banner with a top
// edge that rises and dips along multiple superimposed sine waves, and the
// bottom anchored at the banner's bottom edge so there's no gap.  Returns
// nothing — appends the filled shape directly.
//
// `crestY` controls the ground's average top y-coordinate (the "horizon").
// `amplitude` controls how high humps rise above the average horizon.
function wavyGround(x, y, w, h, crestY, amplitude, fillColor) {
  // Sample the top edge as a series of points combining two sine waves so
  // the bumps look natural (some big, some small).
  const samples = 80;
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const px = x + t * w;
    const noise = Math.sin(t * Math.PI * 2.0 + 0.4) * 0.55
                + Math.sin(t * Math.PI * 5.3 + 1.2) * 0.30
                + Math.sin(t * Math.PI * 9.1) * 0.15;
    const py = crestY - amplitude * (0.5 + noise * 0.5);
    pts.push([px, py]);
  }
  // Build path: top wavy edge left-to-right, then down to bottom-right
  // corner, across to bottom-left, close.
  let d = `M ${pts[0][0]} ${pts[0][1]} `;
  for (let i = 1; i < pts.length; i++) {
    d += `L ${pts[i][0]} ${pts[i][1]} `;
  }
  d += `L ${x + w} ${y + h} L ${x} ${y + h} Z`;
  shapesLayer.appendChild(svgPath(d, { fill: fillColor }));
}

// One flower: a small dot with a few petals around it.  Rendered as a single
// filled circle (the bloom) with `petals` smaller circles around it.
function flower(cx, cy, color) {
  const petalR = 0.55;
  const ringR  = 1.1;
  // 5 petal circles around a center
  for (let i = 0; i < 5; i++) {
    const a = i * (Math.PI * 2 / 5);
    const px = cx + Math.cos(a) * ringR;
    const py = cy + Math.sin(a) * ringR;
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', px); c.setAttribute('cy', py);
    c.setAttribute('r',  petalR);
    c.setAttribute('fill', color);
    shapesLayer.appendChild(c);
  }
  // Yellow center dot
  const center = document.createElementNS(SVG_NS, 'circle');
  center.setAttribute('cx', cx); center.setAttribute('cy', cy);
  center.setAttribute('r', petalR * 0.85);
  center.setAttribute('fill', '#f4d65a');
  shapesLayer.appendChild(center);
}

// Composite grass scene: a few mounds with tufts cresting them, scattered
// flowers, and individual blades around.
function grassScene(x, y, w, h) {
  // Palette: hills go DARK in the back to LIGHT in the front.
  // Hill fill colors are now close to their blade colors so where
  // blades don't fully cover, the underlying ground harmonizes
  // instead of glowing through as a brighter green.
  const HILL_BACK   = '#2e6118';   // darkest — closer to BLADE_BACK
  const HILL_MID    = '#477f1f';   // mid — closer to BLADE_MID
  const HILL_FRONT  = '#629f28';   // lightest — closer to BLADE_FRONT
  const BLADE_BACK  = '#244e14';
  const BLADE_MID   = '#356117';
  const BLADE_FRONT = '#4c7a1c';
  // Very dark backdrop behind all hills — the absolute back of the
  // scene, covered by leaves to suggest a deep forest beyond.
  const BACKDROP    = '#143008';

  const flowerHues  = [
    { petal: '#e94f8a', center: '#f4d65a' },   // pink / yellow
    { petal: '#f0f0f0', center: '#f4d65a' },   // white daisy
    { petal: '#f4d65a', center: '#c08a1a' },   // yellow
    { petal: '#b075d6', center: '#f4d65a' },   // purple
    { petal: '#ee8c45', center: '#7a2e0c' },   // orange
  ];

  // Build a hill's filled polygon AND return its sampled crest points.
  // Doesn't append to shapesLayer yet — caller decides when to draw.
  function buildHill(crestFrac, ampFrac, phase, freqA, freqB, color) {
    const samples = 80;
    const crestY  = y + h * crestFrac;
    const amp     = h * ampFrac;
    const pts = [];
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const px = x + t * w;
      const noise = Math.sin(t * Math.PI * freqA + phase) * 0.65
                  + Math.sin(t * Math.PI * freqB + phase * 1.7) * 0.35;
      const py = crestY - amp * noise;
      pts.push([px, py]);
    }
    let d = `M ${x} ${y + h} L ${pts[0][0]} ${pts[0][1]} `;
    for (let i = 1; i < pts.length; i++) d += `L ${pts[i][0]} ${pts[i][1]} `;
    d += `L ${x + w} ${y + h} Z`;
    return { pts, d, color };
  }

  function drawHill(hill) {
    shapesLayer.appendChild(svgPath(hill.d, { fill: hill.color }));
  }

  // Sample y at any x along a hill's polyline.
  function crestYAt(crest, px) {
    let lo = 0, hi = crest.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (crest[mid][0] <= px) lo = mid; else hi = mid;
    }
    const span = Math.max(1e-6, crest[hi][0] - crest[lo][0]);
    const t = (px - crest[lo][0]) / span;
    return crest[lo][1] + (crest[hi][1] - crest[lo][1]) * t;
  }

  // Return a function that takes x and returns y on this crest.
  // Useful when the "top" of a band is just the banner top (a constant
  // y), so we don't need a hill polygon to provide the lookup.
  function crestYFn(crest) {
    return px => crestYAt(crest, px);
  }
  // Constant-y "crest" — used for the flat banner top edge.
  function constYFn(yConst) {
    return () => yConst;
  }

  // Plant tufts across a hill's visible band.  Top edge is this hill's
  // crest; bottom edge is either the next hill's crest or the banner
  // bottom.  Each BLADE picks a random color along the spectrum from
  // `darkColor` (typical blade tone) toward `lightColor` (the hill
  // base color) for tonal striation — most blades stay dark, some
  // catch "light" reading as the underlying hill showing through or
  // a sun-hit blade.
  //
  // X-range extends PAST the banner edges so the clipPath cuts the
  // blades cleanly instead of revealing a visible "base line" at the
  // banner border.
  function plantTufts(thisCrest, nextCrest, count, darkColor, lightColor, minScale, maxScale) {
    const edgeBleed = 4;
    const xMin = x - edgeBleed, xMax = x + w + edgeBleed;
    // Step 1: generate ALL tuft positions first, collecting (bx, by, scale)
    const tufts = [];
    for (let i = 0; i < count; i++) {
      const bx = xMin + Math.random() * (xMax - xMin);
      const xClamp = Math.max(x, Math.min(x + w, bx));
      const topY = crestYAt(thisCrest, xClamp);
      const botY = nextCrest ? crestYAt(nextCrest, xClamp) : (y + h + edgeBleed);
      if (botY <= topY) continue;
      const by = topY + Math.random() * (botY - topY);
      const scale = minScale + Math.random() * (maxScale - minScale);
      tufts.push({ bx, by, scale });
    }
    // Step 2: sort by y ASCENDING so tufts higher on the hill (smaller y)
    // are drawn FIRST and tufts closer to the viewer (larger y) layer
    // on top — back-to-front within the hill.
    tufts.sort((a, b) => a.by - b.by);
    // Step 3: draw in sorted order
    for (const t of tufts) {
      grassTuftOnGround(t.bx, t.by, darkColor, lightColor, t.scale);
    }
  }

  // Build the three grass hills (no separate leaf-canopy hill — the
  // leaves now sit on a flat backdrop rectangle at the absolute back).
  const backHill   = buildHill(0.40, 0.18, 0.6, 1.2, 3.1, HILL_BACK);
  const midHill    = buildHill(0.55, 0.22, 2.1, 1.6, 4.3, HILL_MID);
  const frontHill  = buildHill(0.72, 0.20, 0.0, 1.8, 5.7, HILL_FRONT);

  // ── DRAW BACK-TO-FRONT, INTERLEAVED ──────────────────────────────
  //
  // Layer 0 (VERY BACK): flat dark-green rectangle filling the entire
  // banner, then dense dark leaves on top of it.  The rectangle covers
  // edge-to-edge so no banner fill shows above the leaves.
  shapesLayer.appendChild(svgRect(x, y, w, h, BACKDROP));
  plantLeavesInBand(y, crestYFn(backHill.pts), '#1f3e10', '#2e5818', 6500);

  // Layer 1: back hill with DENSE grass blades.  Each blade randomly
  // mixes between BLADE_BACK and HILL_BACK for visible tonal striation
  // — some blades darker (shadowed), some lighter (sun-hit).
  drawHill(backHill);
  plantTufts(backHill.pts, midHill.pts, 3000, BLADE_BACK, HILL_BACK, 0.40, 0.60);

  // Layer 2: mid hill — DENSE grass with mid striation.
  drawHill(midHill);
  plantTufts(midHill.pts, frontHill.pts, 3800, BLADE_MID, HILL_MID, 0.60, 0.85);

  // Layer 3: front hill — DENSE grass with front striation.
  drawHill(frontHill);
  plantTufts(frontHill.pts, null, 8000, BLADE_FRONT, HILL_FRONT, 0.85, 1.20);

  // ── Flowers on the front hill (drawn last, on top of all foliage) ──
  const flowerCount = 11;
  const margin = 2;
  for (let i = 0; i < flowerCount; i++) {
    const t = (i + Math.random()) / flowerCount;
    const sampleIdx = Math.min(frontHill.pts.length - 1,
                               Math.max(0, Math.floor(t * frontHill.pts.length)));
    const [gx, gy] = frontHill.pts[sampleIdx];
    if (gx < x + margin + 3 || gx > x + w - margin - 3) continue;
    const stemH = 2.5 + Math.random() * 2.0;
    const headX = gx + (Math.random() - 0.5) * 0.6;
    const headY = gy - stemH;
    const hue = flowerHues[Math.floor(Math.random() * flowerHues.length)];
    drawFlower(gx, gy, headX, headY, hue);
  }

  // Plant a dense layer of overlapping leaves across a hill's visible
  // band.  Each leaf is a small rotated ellipse with slight color
  // jitter.  Mixes two base shades (darker + slightly-less-dark) so the
  // canopy reads as varied foliage with internal depth.
  // Plant leaves filling the band between topYFn(x) and botYFn(x).
  // Either argument can be a number (constant y) or a function (x → y).
  function plantLeavesInBand(topYArg, botYArg, darkColor, lightColor, leafCount) {
    const edgeBleed = 4;
    const xMin = x - edgeBleed, xMax = x + w + edgeBleed;
    const topYFn = (typeof topYArg === 'function') ? topYArg : (() => topYArg);
    const botYFn = (typeof botYArg === 'function') ? botYArg : (() => botYArg);
    for (let i = 0; i < leafCount; i++) {
      const lx = xMin + Math.random() * (xMax - xMin);
      const xClamp = Math.max(x, Math.min(x + w, lx));
      const topY = topYFn(xClamp);
      const botY = botYFn(xClamp);
      if (botY <= topY) continue;
      const ly = topY + Math.random() * (botY - topY);
      const depthT = (ly - topY) / Math.max(0.001, botY - topY);
      const sizeScale = 0.6 + depthT * 0.6 + Math.random() * 0.4;
      const rx = (0.85 * sizeScale) * (0.9 + Math.random() * 0.2);
      const ry = (0.40 * sizeScale) * (0.9 + Math.random() * 0.2);
      const angle = Math.random() * 360;
      const base = Math.random() < 0.70 ? darkColor : lightColor;
      const color = jitterColor(base, 1.2);

      const el = document.createElementNS(SVG_NS, 'ellipse');
      el.setAttribute('cx', lx); el.setAttribute('cy', ly);
      el.setAttribute('rx', rx); el.setAttribute('ry', ry);
      el.setAttribute('transform', `rotate(${angle} ${lx} ${ly})`);
      el.setAttribute('fill', color);
      shapesLayer.appendChild(el);
    }
  }
}

// Tiny per-blade color jitter — vary lightness by up to ±12%.  Takes
// a hex color and a strength factor, returns a hex string.
function jitterColor(hex, strength = 1) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // Multiplicative jitter ±12% per channel * strength
  const factor = 1 + (Math.random() - 0.5) * 0.24 * strength;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const toHex = v => clamp(v).toString(16).padStart(2, '0');
  return `#${toHex(r * factor)}${toHex(g * factor)}${toHex(b * factor)}`;
}

// Linear-interpolate two hex colors.  t=0 → hexA, t=1 → hexB.
function mixColors(hexA, hexB, t) {
  const rA = parseInt(hexA.slice(1, 3), 16), gA = parseInt(hexA.slice(3, 5), 16), bA = parseInt(hexA.slice(5, 7), 16);
  const rB = parseInt(hexB.slice(1, 3), 16), gB = parseInt(hexB.slice(3, 5), 16), bB = parseInt(hexB.slice(5, 7), 16);
  const r = Math.round(rA + (rB - rA) * t);
  const g = Math.round(gA + (gB - gA) * t);
  const b = Math.round(bA + (bB - bA) * t);
  const toHex = v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

// Draw a single grass tuft of blades emerging from a ground point.
// Each blade picks a random color along the spectrum from `darkColor`
// (most common — typical blade tone) to `lightColor` (the hill's base
// color, less common — reads as sun-hit highlight or underlying ground
// peeking through).  Plus a tiny per-blade jitter on top.
function grassTuftOnGround(gx, gy, darkColor, lightColor, scale = 1.0) {
  const n = 3 + Math.floor(Math.random() * 3);   // 3-5 blades
  const baseSpread = 1.4 * scale;
  for (let i = 0; i < n; i++) {
    const t  = (i - (n - 1) / 2) / Math.max(1, n - 1);
    const bx = gx + t * baseSpread;
    const by = gy + 0.3 * scale;
    const heightBase  = (3.0 + Math.random() * 2.0) * scale;
    const heightCurve = 1 - Math.abs(t) * 0.3;
    const height = heightBase * heightCurve;
    const leanAmount = t * (0.9 + Math.random() * 0.7) + (Math.random() - 0.5) * 0.4;
    const tipX = bx + leanAmount * scale;
    const tipY = by - height;
    const halfBase = 0.28 * scale;
    const ctrl1X = bx - halfBase + (tipX - (bx - halfBase)) * 0.4;
    const ctrl1Y = by + (tipY - by) * 0.5;
    const ctrl2X = bx + halfBase + (tipX - (bx + halfBase)) * 0.4;
    const ctrl2Y = by + (tipY - by) * 0.5;
    const d = `M ${bx - halfBase} ${by} ` +
              `Q ${ctrl1X} ${ctrl1Y} ${tipX} ${tipY} ` +
              `Q ${ctrl2X} ${ctrl2Y} ${bx + halfBase} ${by} ` +
              `Z`;
    // Tonal striation: mix between darkColor and lightColor with a
    // power-distributed t (skewed toward dark — most blades are
    // shadowed, some are sun-hit), then add small jitter.
    const mixT = Math.pow(Math.random(), 1.6);    // skew toward 0 (dark)
    const baseColor = mixColors(darkColor, lightColor, mixT);
    shapesLayer.appendChild(svgPath(d, { fill: jitterColor(baseColor, 0.6) }));
  }
}

// Draw a flower: stem from (gx,gy) to (headX,headY), then a multi-petal
// bloom at the head.  Petals are short ellipses arranged in a ring with
// a center disc.
function drawFlower(gx, gy, headX, headY, hue) {
  // 1. Stem — single quadratic curve so it leans slightly
  const stemCtrlX = (gx + headX) / 2 + (Math.random() - 0.5) * 0.5;
  const stemCtrlY = (gy + headY) / 2;
  const stemD = `M ${gx} ${gy} Q ${stemCtrlX} ${stemCtrlY} ${headX} ${headY}`;
  shapesLayer.appendChild(svgPath(stemD, {
    fill: 'none', stroke: '#2a5e1a',
    strokeWidth: LINE_W * 0.7,
  }));
  // 2. Petals — 6 oval petals around center
  const nPetals = 6;
  const petalRx = 0.55;
  const petalRy = 1.05;
  const ringR = 0.85;
  for (let i = 0; i < nPetals; i++) {
    const a = i * (Math.PI * 2 / nPetals);
    const px = headX + Math.cos(a) * ringR;
    const py = headY + Math.sin(a) * ringR;
    const ellipse = document.createElementNS(SVG_NS, 'ellipse');
    ellipse.setAttribute('cx', px); ellipse.setAttribute('cy', py);
    ellipse.setAttribute('rx', petalRx); ellipse.setAttribute('ry', petalRy);
    // Rotate the petal so its long axis points outward from the center
    const deg = (a * 180 / Math.PI) + 90;
    ellipse.setAttribute('transform', `rotate(${deg} ${px} ${py})`);
    ellipse.setAttribute('fill', hue.petal);
    shapesLayer.appendChild(ellipse);
  }
  // 3. Center disc
  const c = document.createElementNS(SVG_NS, 'circle');
  c.setAttribute('cx', headX); c.setAttribute('cy', headY);
  c.setAttribute('r', 0.75);
  c.setAttribute('fill', hue.center);
  shapesLayer.appendChild(c);
}

// Composite river scene: SAND zone above, MUD zone below, with a meandering
// blue river band running horizontally across the middle.  The river's edges
// undulate; flow lines inside suggest current.
function riverScene(x, y, w, h) {
  const SAND       = '#e8c773';
  const MUD        = '#6b4d2e';
  const RIVER_BLUE = '#3a91c2';
  const DEEP_BLUE  = '#0e3450';

  // River runs horizontally through the middle ~50% of the banner height,
  // with sinusoidal undulation top-and-bottom.  Big slow S-curves dominate;
  // a small higher-frequency wiggle adds character without breaking flow.
  const riverMidY = y + h * 0.5;
  const riverHalfBase = h * 0.30;       // half-thickness at midline
  function riverEdgeY(side, px) {
    // side: -1 = top edge, +1 = bottom edge.  Both edges undulate together
    // following the same big S-curve so the river itself meanders, with a
    // smaller independent wobble on each edge.
    const t = (px - x) / w;
    // Big slow primary wave — drives the meander
    const meander = Math.sin(t * Math.PI * 1.6 + 0.5) * 0.85;
    // Small fast wobble — different phase per edge, much smaller amplitude
    const phase = side === -1 ? 0 : 1.2;
    const wobble = Math.sin(t * Math.PI * 4.2 + phase) * 0.18;
    // Both edges shifted by the SAME meander → river snakes left/right
    return riverMidY + meander * h * 0.15
                     + side * (riverHalfBase + wobble * h * 0.08);
  }
  const samples = 60;
  const topPts = [], botPts = [];
  for (let i = 0; i <= samples; i++) {
    const px = x + (i / samples) * w;
    topPts.push([px, riverEdgeY(-1, px)]);
    botPts.push([px, riverEdgeY(+1, px)]);
  }

  // 1. SAND on top — a polygon from banner top to river top edge
  let dSand = `M ${x} ${y} L ${x + w} ${y} `;
  for (let i = topPts.length - 1; i >= 0; i--) {
    dSand += `L ${topPts[i][0]} ${topPts[i][1]} `;
  }
  dSand += 'Z';
  shapesLayer.appendChild(svgPath(dSand, { fill: SAND }));

  // 2. MUD on bottom — banner bottom up to river bottom edge
  let dMud = `M ${x} ${y + h} L ${x + w} ${y + h} `;
  for (let i = botPts.length - 1; i >= 0; i--) {
    dMud += `L ${botPts[i][0]} ${botPts[i][1]} `;
  }
  dMud += 'Z';
  shapesLayer.appendChild(svgPath(dMud, { fill: MUD }));

  // 3. RIVER body — between top and bottom edges
  let dRiver = `M ${topPts[0][0]} ${topPts[0][1]} `;
  for (let i = 1; i < topPts.length; i++) {
    dRiver += `L ${topPts[i][0]} ${topPts[i][1]} `;
  }
  for (let i = botPts.length - 1; i >= 0; i--) {
    dRiver += `L ${botPts[i][0]} ${botPts[i][1]} `;
  }
  dRiver += 'Z';
  shapesLayer.appendChild(svgPath(dRiver, { fill: RIVER_BLUE }));

  // 4. River bank outlines (top and bottom edges of the river)
  function buildEdgePath(pts) {
    let d = `M ${pts[0][0]} ${pts[0][1]} `;
    for (let i = 1; i < pts.length; i++) d += `L ${pts[i][0]} ${pts[i][1]} `;
    return d;
  }
  shapesLayer.appendChild(svgPath(buildEdgePath(topPts),
    { fill: 'none', stroke: DEEP_BLUE, strokeWidth: LINE_W }));
  shapesLayer.appendChild(svgPath(buildEdgePath(botPts),
    { fill: 'none', stroke: DEEP_BLUE, strokeWidth: LINE_W }));

  // 5. A few flow waves inside the river to suggest current
  const flowCount = 8;
  for (let i = 0; i < flowCount; i++) {
    const cx = x + (i + 0.5 + (Math.random() - 0.5) * 0.5) * w / flowCount;
    const cy = riverMidY + (Math.random() - 0.5) * h * 0.18;
    const ww = 6 + Math.random() * 3;
    wave(cx, cy, ww, DEEP_BLUE);
  }
}


function decorateBanner(s, x, y, w, h, fillColor, strokeColor) {
  if (s === 0) {
    // Lava — Voronoi rocks with glowing magma cracks between them.
    magmaRocks(x, y, w, h, '#f47c2c', '#0a0a0a');
  } else if (s === 1) {
    // Sand — cracked desert: Voronoi cells in mottled sand colors,
    // separated by thin dark dried-mud cracks.
    crackedDesert(x, y, w, h);
  } else if (s === 2) {
    // Sea — water caustics: two layers of sharp-minus-smooth Voronoi
    // distance fields.  Dark blue underlay (slider-controlled) + bright
    // white tight ridges (baked) on top.
    waterCaustics(x, y, w, h);
  } else if (s === 3) {
    // Grass row: mounds, scattered tufts, flowers
    grassScene(x, y, w, h);
  }
}

// Themed terrain banner — a filled rounded rectangle with a colored outline,
// optionally decorated with terrain ornaments keyed off the section index.
function terrainBanner(s, x, y, w, h, fillColor, strokeColor) {
  // Crisp fill underlay so color stays uniform under any displacement
  shapesLayer.appendChild(svgRect(x, y, w, h, fillColor, 2.5));

  // Set up a clipPath matching the banner's rounded-rect shape so any
  // decoration that draws beyond the banner (e.g. sand Voronoi cells that
  // expand slightly past the rectangle) is clipped to the rounded outline.
  const clipId = `banner-clip-${Math.floor(Math.random() * 1e9)}`;
  const cp = document.createElementNS(SVG_NS, 'clipPath');
  cp.setAttribute('id', clipId);
  const cpPath = document.createElementNS(SVG_NS, 'path');
  cpPath.setAttribute('d', roundedRectPath(x, y, w, h, 2.5));
  cp.appendChild(cpPath);
  board.querySelector('defs').appendChild(cp);

  // Decorations live inside a clipped group so they can't escape the
  // banner shape.  Append our clipped group to the current shapesLayer
  // (which may itself be inside a filter, e.g. for the grain effect) and
  // SWAP shapesLayer for the duration so decoration primitives append
  // into the clipped group.
  const clipped = document.createElementNS(SVG_NS, 'g');
  clipped.setAttribute('clip-path', `url(#${clipId})`);
  const saved = shapesLayer;
  saved.appendChild(clipped);
  shapesLayer = clipped;
  try {
    decorateBanner(s, x, y, w, h, fillColor, strokeColor);
  } finally {
    shapesLayer = saved;
  }

  // Outline on top (outside the clip so the stroke's outer half stays visible)
  shapesLayer.appendChild(svgPath(roundedRectPath(x, y, w, h, 2.5),
    { fill: 'none', stroke: strokeColor, strokeWidth: LINE_W }));
}

// Castle at the top of the board.
// Footprint: (x, y) is top-left of the bounding box, (w, h) is the size.
// Built from primitives: an outer silhouette path, an arch, and inner squares.
function castle(x, y, w, h) {

  // Proportions.  Heights snap to a whole number of brick rows so the bottom
  // row always renders as a full brick (no thin slivers).
  const towerW   = w * 0.13;
  const merlonH  = h * 0.045;          // = brick row height
  const towerRows = Math.round((h * 1.00) / merlonH);   // ~22 rows
  const bodyRows  = Math.round((h * 0.78) / merlonH);   // ~17 rows
  const towerH   = towerRows * merlonH;
  const bodyH    = bodyRows  * merlonH;
  const towerTop = y;
  const groundY  = towerTop + towerH;
  const bodyTop  = groundY - bodyH;
  const bodyW    = w - towerW * 2;
  const bodyX    = x + towerW;

  // Crenellation parameters — square notches across the top edge.  The pattern
  // is M-C-M-C-...-M (always starting and ending with a merlon) so the corners
  // of every parapet read as raised bumps.  Pass the desired merlonCount per
  // section to control how many bumps appear.
  function crenellate(x0, x1, topY, merlonCount) {
    const span = x1 - x0;
    const segCount = 2 * merlonCount - 1;     // M C M C ... M
    const segW = span / segCount;
    const merlonY = topY;                      // top of merlon
    const crenelY = topY + merlonH;            // floor of crenel
    const pts = [];
    for (let i = 0; i < segCount; i++) {
      const segStart = x0 + i * segW;
      const segEnd   = segStart + segW;
      const isMerlon = (i % 2 === 0);
      const y        = isMerlon ? merlonY : crenelY;
      if (i === 0) pts.push([segStart, y]);
      pts.push([segEnd, y]);
      if (i < segCount - 1) {
        pts.push([segEnd, isMerlon ? crenelY : merlonY]);  // vertical step
      }
    }
    return pts;
  }

  // Build full outline as a single path so rough.js draws a unified silhouette.
  // Side walls reach all the way up to merlon level so the corners ARE merlons,
  // not crenels.
  //
  // BRICK GRID: each tower has exactly THREE merlons, meaning 5 segments
  // (M-C-M-C-M) — so brickW = towerW / 5.  We pick the body's merlon count so
  // its segments are about the same width — making one consistent brick grid
  // across the whole wall.
  const towerMerlons  = 3;
  const towerSegCount = 2 * towerMerlons - 1;     // = 5
  const towerBrickW   = towerW / towerSegCount;
  const brickH        = merlonH;                  // brick row = merlon height
  // Round body to the nearest valid odd segment count given a brick close to
  // the tower brick width
  const bodySegCount  = Math.max(3, Math.round(bodyW / towerBrickW / 2) * 2 + 1);
  const bodyMerlons   = (bodySegCount + 1) / 2;
  const bodyBrickW    = bodyW / bodySegCount;

  let d = '';
  // Up the left side of the left tower, to merlon level
  d += `M ${x} ${groundY} L ${x} ${towerTop}`;
  // Crenellations across the left tower
  for (const [px, py] of crenellate(x, x + towerW, towerTop, towerMerlons)) {
    d += ` L ${px} ${py}`;
  }
  // Drop to body roof (merlon level), then crenellate across body
  d += ` L ${x + towerW} ${bodyTop}`;
  for (const [px, py] of crenellate(x + towerW, x + towerW + bodyW, bodyTop, bodyMerlons)) {
    d += ` L ${px} ${py}`;
  }
  // Rise to right tower top, crenellate
  d += ` L ${x + towerW + bodyW} ${towerTop}`;
  for (const [px, py] of crenellate(x + towerW + bodyW, x + w, towerTop, towerMerlons)) {
    d += ` L ${px} ${py}`;
  }
  // Down the right side to ground, close
  d += ` L ${x + w} ${groundY} Z`;

  // Color: castle outline (darker gray, since the towers now have a 3D
  // gradient that visually delineates them on their own).
  const CASTLE_STROKE = '#6a6a6a';   // a touch darker than BRICK_GROUT (#7a7a7a)
  const BRICK_FILL    = '#b8b6b1';  // gray brick body
  const BRICK_GROUT   = '#7a7a7a';  // light gray mortar (matches other lines in tone)
  const PAPYRUS_FILL  = '#f5e8c4';  // matches the page papyrus color

  // ── Brick fill of the castle silhouette ──
  // The silhouette path `d` has the crenellations cut out, so we just need
  // to fill it with bricks.  To make sure the merlon row IS the top row of
  // bricks (and bricks stagger down from there), we build a per-castle
  // <pattern> whose origin is anchored to the merlon row of each tower.
  //
  // Towers and body have slightly different brick widths, but we can use
  // ONE pattern aligned to the LEFT TOWER and rely on the fact that the body
  // bricks happen to align well enough — OR we can use two clipped fills.
  // Simpler/cleaner: two fills, one for each unique brick width, each clipped
  // to its own region.
  function makeBrickPattern(id, brickW, originX, originY) {
    // Pattern tile = brickW wide × (2*brickH) tall.  Two rows: top row has a
    // joint at x=0, bottom row at x=brickW/2 (running bond).
    const pat = document.createElementNS(SVG_NS, 'pattern');
    pat.setAttribute('id', id);
    pat.setAttribute('patternUnits', 'userSpaceOnUse');
    pat.setAttribute('width',  brickW);
    pat.setAttribute('height', brickH * 2);
    // patternTransform shifts the pattern's origin in viewBox space — anchor
    // the (0,0) of the tile to (originX, originY) so the first row of bricks
    // begins exactly at the merlon row.
    pat.setAttribute('patternTransform', `translate(${originX} ${originY})`);

    // Brick body fill
    const bg = document.createElementNS(SVG_NS, 'rect');
    bg.setAttribute('width',  brickW);
    bg.setAttribute('height', brickH * 2);
    bg.setAttribute('fill', BRICK_FILL);
    pat.appendChild(bg);

    // Mortar drawn as a SINGLE continuous path with multiple subpaths.
    // Horizontal lines at y=0 and y=brickH within the tile.  When the
    // pattern tiles vertically, tile N's y=0 line is the SAME absolute
    // y as tile N-1's y=2*brickH boundary — but tile N-1 doesn't draw
    // anything at y=2*brickH (that's its bottom edge, exclusive), so no
    // doubling.  Verticals: x=0 in row 1 (top half), x=brickW/2 in row 2
    // (staggered for running bond).
    const mortarD =
      `M 0 0 L ${brickW} 0 ` +                                  // top of row 1
      `M 0 ${brickH} L ${brickW} ${brickH} ` +                  // between rows
      `M 0 0 L 0 ${brickH} ` +                                  // vertical row 1
      `M ${brickW/2} ${brickH} L ${brickW/2} ${brickH*2}`;       // vertical row 2
    const mortar = document.createElementNS(SVG_NS, 'path');
    mortar.setAttribute('d', mortarD);
    mortar.setAttribute('stroke', BRICK_GROUT);
    mortar.setAttribute('stroke-width', LINE_W);
    mortar.setAttribute('fill', 'none');
    pat.appendChild(mortar);
    return pat;
  }

  // Build a <defs> just for this castle.  Living inside the SVG (not at the
  // top-level defs) keeps the brick coordinates self-contained — change the
  // castle position and bricks follow.
  const localDefs = document.createElementNS(SVG_NS, 'defs');

  const ltPatId = 'bricks-tower-l-' + Math.floor(Math.random() * 1e9);
  const rtPatId = 'bricks-tower-r-' + Math.floor(Math.random() * 1e9);
  const bodyPatId  = 'bricks-body-'  + Math.floor(Math.random() * 1e9);
  // Each tower's bricks anchor at its OWN top-left so the merlons line up
  // with full bricks underneath, not half-bricks.
  localDefs.appendChild(makeBrickPattern(ltPatId,   towerBrickW, x,                  towerTop));
  localDefs.appendChild(makeBrickPattern(rtPatId,   towerBrickW, x + towerW + bodyW, towerTop));
  localDefs.appendChild(makeBrickPattern(bodyPatId, bodyBrickW,  x + towerW,         bodyTop));

  // Clip paths so each fill region stays within its column.  Easier than the
  // full silhouette: clip to a simple rectangle per section (left tower,
  // body, right tower).  The silhouette outline drawn after will mask any
  // overflow visually.
  function clipRectId(idSuffix, rx, ry, rw, rh) {
    const cp = document.createElementNS(SVG_NS, 'clipPath');
    cp.setAttribute('id', idSuffix);
    const r = document.createElementNS(SVG_NS, 'rect');
    r.setAttribute('x', rx); r.setAttribute('y', ry);
    r.setAttribute('width', rw); r.setAttribute('height', rh);
    cp.appendChild(r);
    return cp;
  }
  const ltClipId = 'cliptl-' + Math.floor(Math.random() * 1e9);
  const bClipId  = 'clipb-'  + Math.floor(Math.random() * 1e9);
  const rtClipId = 'cliprt-' + Math.floor(Math.random() * 1e9);
  localDefs.appendChild(clipRectId(ltClipId, x,                  towerTop, towerW, h));
  localDefs.appendChild(clipRectId(bClipId,  x + towerW,         bodyTop,  bodyW,  h - (bodyTop - towerTop)));
  localDefs.appendChild(clipRectId(rtClipId, x + towerW + bodyW, towerTop, towerW, h));
  shapesLayer.appendChild(localDefs);

  // Brick fill: instead of tiling a pattern (which causes subtle tile-boundary
  // artifacts where every other row appears thinner), we draw the bricks
  // explicitly per section.  Each section gets:
  //   - a solid BRICK_FILL rect (clipped to the section's silhouette)
  //   - a single <path> containing every horizontal and vertical grout line,
  //     in absolute coordinates, drawn ONCE — no tile boundaries to worry
  //     about so all rows render identically.
  function paintBricks(originX, originY, sectionW, sectionH, brickW, clipId) {
    // Solid fill — clip to silhouette
    const fillPath = document.createElementNS(SVG_NS, 'path');
    fillPath.setAttribute('d', d);
    fillPath.setAttribute('fill', BRICK_FILL);
    fillPath.setAttribute('clip-path', `url(#${clipId})`);
    shapesLayer.appendChild(fillPath);

    // Build grout lines explicitly.  Skip lines that would land exactly on
    // the section's TOP edge (towerTop) or BOTTOM edge (groundY) — those
    // overlap the silhouette outline and produce visible artifacts.  Same
    // stroke width as every other line in the design (LINE_W).
    const numRows = Math.ceil(sectionH / brickH) + 1;
    const numCols = Math.ceil(sectionW / brickW) + 1;
    const sectionBottomY = originY + sectionH;
    // Tiny inset from each edge so the bricks don't paint right on the
    // silhouette outline (which causes doubled-stroke artifacts).
    const edgeInset = 0.3;
    let grout = '';
    // Horizontal lines: one BETWEEN each pair of brick rows.  Skip r=0
    // (= section top) and skip any line at or beyond the section bottom.
    for (let r = 1; r < numRows; r++) {
      const ry = originY + r * brickH;
      if (ry >= sectionBottomY - edgeInset) break;
      grout += `M ${originX} ${ry} L ${originX + sectionW} ${ry} `;
    }
    // Vertical lines: alternate offset per row (running bond).  Each row's
    // verticals span from one horizontal to the next.  We DON'T draw
    // verticals in the bottom partial row — they'd touch the silhouette
    // outline at sectionBottomY and produce an artifact band along the
    // bottom edge mirroring what we already fixed at the top.
    for (let r = 0; r < numRows; r++) {
      const ry0 = originY + r * brickH;
      const ry1 = ry0 + brickH;
      // Stop if this row's bottom would land at or below the section bottom.
      if (ry1 > sectionBottomY - edgeInset) break;
      const rowOffset = (r % 2 === 0) ? 0 : brickW / 2;
      for (let c = -1; c <= numCols; c++) {
        const vx = originX + rowOffset + c * brickW;
        grout += `M ${vx} ${ry0} L ${vx} ${ry1} `;
      }
    }
    const groutPath = document.createElementNS(SVG_NS, 'path');
    groutPath.setAttribute('d', grout);
    groutPath.setAttribute('stroke', BRICK_GROUT);
    groutPath.setAttribute('stroke-width', LINE_W);
    groutPath.setAttribute('stroke-linecap', 'round');
    groutPath.setAttribute('stroke-linejoin', 'round');
    groutPath.setAttribute('fill', 'none');
    groutPath.setAttribute('clip-path', `url(#${clipId})`);
    shapesLayer.appendChild(groutPath);
  }

  paintBricks(x,                  towerTop, towerW, h,                              towerBrickW, ltClipId);
  paintBricks(x + towerW,         bodyTop,  bodyW,  h - (bodyTop - towerTop),       bodyBrickW,  bClipId);
  paintBricks(x + towerW + bodyW, towerTop, towerW, h,                              towerBrickW, rtClipId);

  // 3D illusion on the towers — each tower gets its OWN horizontal gradient
  // in user-space coordinates, going dark → transparent → dark across its
  // full width.  At 50% black opacity the effect is subtle but clearly
  // suggests cylindrical shading.
  function makeTowerGradient(id, x0, x1) {
    const g = document.createElementNS(SVG_NS, 'linearGradient');
    g.setAttribute('id', id);
    g.setAttribute('gradientUnits', 'userSpaceOnUse');
    g.setAttribute('x1', x0); g.setAttribute('y1', 0);
    g.setAttribute('x2', x1); g.setAttribute('y2', 0);
    const stops = [
      [0,   '#000', 0.18],
      [0.5, '#000', 0.0],
      [1,   '#000', 0.18],
    ];
    for (const [offset, color, opacity] of stops) {
      const s = document.createElementNS(SVG_NS, 'stop');
      s.setAttribute('offset', `${offset * 100}%`);
      s.setAttribute('stop-color', color);
      s.setAttribute('stop-opacity', opacity);
      g.appendChild(s);
    }
    return g;
  }
  const leftGradId  = 'lgrad-' + Math.floor(Math.random() * 1e9);
  const rightGradId = 'rgrad-' + Math.floor(Math.random() * 1e9);
  localDefs.appendChild(makeTowerGradient(leftGradId,  x,                  x + towerW));
  localDefs.appendChild(makeTowerGradient(rightGradId, x + towerW + bodyW, x + w));

  function towerOverlayClipped(clipId, gradId) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', `url(#${gradId})`);
    p.setAttribute('clip-path', `url(#${clipId})`);
    shapesLayer.appendChild(p);
  }
  towerOverlayClipped(ltClipId, leftGradId);
  towerOverlayClipped(rtClipId, rightGradId);

  // Outer outline — drawn AFTER bricks AND gradient so it sits on top.
  // Per user request: thinner outline weight (LINE_W * 0.85) since the tower
  // gradient now does most of the visual delineation.
  shapesLayer.appendChild(svgPath(d, {
    fill: 'none', stroke: CASTLE_STROKE, strokeWidth: LINE_W * 0.85,
  }));

  // Inner vertical lines at the tower–body seams.  These run from the body's
  // roof level (merlon top — same level as where the silhouette steps down)
  // to the ground, making the towers read as distinct columns.
  const leftSeamX  = x + towerW;
  const rightSeamX = x + towerW + bodyW;
  for (const sx of [leftSeamX, rightSeamX]) {
    shapesLayer.appendChild(svgLine(sx, bodyTop, sx, groundY,
      { stroke: CASTLE_STROKE, strokeWidth: LINE_W * 0.85 }));
  }

  // Arched doorway in the center of the body — TWO doors meeting at a center
  // seam, each rendered by the door() primitive.  The wood pattern tiles from
  // the seam outward so plank dividers line up across both doors.
  const archW = bodyW * 0.28;
  const archH = bodyH * 0.65;
  const archX = bodyX + (bodyW - archW) / 2;
  const archY = groundY - archH;
  const seamX = archX + archW / 2;
  // Path geometry shared by both halves: the full arch.
  const peakX = archX + archW / 2;
  const peakY = archY;
  const archD = [
    `M ${archX} ${groundY}`,
    `L ${archX} ${archY + archH * 0.45}`,
    `Q ${archX} ${archY} ${peakX} ${peakY}`,
    `Q ${archX + archW} ${archY} ${archX + archW} ${archY + archH * 0.45}`,
    `L ${archX + archW} ${groundY}`,
  ].join(' ');

  // Each half-door is the full arch path, clipped to its half via a clip rect.
  // The wood pattern's `patternTransform` translates so x=0 of the tile sits
  // at the seam — both halves anchor from the same seam, so plank dividers
  // line up across.
  function door(halfClipId, flip) {
    // Wood pattern is already in top-level defs; reusing it directly anchors
    // from (0,0) which is wrong.  Make a per-door pattern instance with a
    // shifted patternTransform so x=0 of the tile sits at the seam.
    const patId = 'wood-' + (flip ? 'r' : 'l') + '-' + Math.floor(Math.random() * 1e9);
    const ref = document.createElementNS(SVG_NS, 'pattern');
    ref.setAttribute('id', patId);
    ref.setAttribute('href', '#wood');
    // For the left half: pattern's x=0 should land at the seam, which means
    // translating the tile origin to (seamX, 0).  For the right half: same
    // (so the first divider on the inner edge is at the seam).
    ref.setAttribute('patternTransform', `translate(${seamX} 0)`);
    localDefs.appendChild(ref);

    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', archD);
    path.setAttribute('fill', `url(#${patId})`);
    path.setAttribute('clip-path', `url(#${halfClipId})`);
    shapesLayer.appendChild(path);
  }
  // Two clip rects: left half from archX to seamX, right half from seamX to archX+archW.
  const dlClipId = 'doorL-' + Math.floor(Math.random() * 1e9);
  const drClipId = 'doorR-' + Math.floor(Math.random() * 1e9);
  localDefs.appendChild(clipRectId(dlClipId, archX,  archY, archW / 2, archH));
  localDefs.appendChild(clipRectId(drClipId, seamX,  archY, archW / 2, archH));

  // Brick frame around the door — like a window sill, but tracing the arch.
  // Built as a wider, taller arch path drawn BEFORE the doors so the doors
  // and outline cover its inner edge, leaving only the outer band visible.
  const frameThickness = archW * 0.06;
  const fArchX = archX - frameThickness;
  const fArchY = archY - frameThickness;
  const fArchW = archW + frameThickness * 2;
  const fArchH = archH + frameThickness;             // grows up only; bottom stays on groundY
  const fPeakX = fArchX + fArchW / 2;
  const fPeakY = fArchY;
  const frameD = [
    `M ${fArchX} ${groundY}`,
    `L ${fArchX} ${fArchY + fArchH * 0.45}`,
    `Q ${fArchX} ${fArchY} ${fPeakX} ${fPeakY}`,
    `Q ${fArchX + fArchW} ${fArchY} ${fArchX + fArchW} ${fArchY + fArchH * 0.45}`,
    `L ${fArchX + fArchW} ${groundY}`,
  ].join(' ');
  // Filled gray (brick color)
  const frameFill = document.createElementNS(SVG_NS, 'path');
  frameFill.setAttribute('d', frameD);
  frameFill.setAttribute('fill', BRICK_FILL);
  shapesLayer.appendChild(frameFill);

  // Frame gets a soft inset shadow — light center (the stone color shows
  // through), gentle darkening just inside the outer outline.  Combined
  // with a centerline highlight (radial gradient lighter in the middle)
  // for a "raised stone band" look.
  const frameHighlightId = `framehl-${Math.floor(Math.random() * 1e9)}`;
  const frameHl = document.createElementNS(SVG_NS, 'radialGradient');
  frameHl.setAttribute('id', frameHighlightId);
  frameHl.setAttribute('cx', '50%');
  frameHl.setAttribute('cy', '60%');
  frameHl.setAttribute('r', '60%');
  frameHl.setAttribute('fx', '50%');
  frameHl.setAttribute('fy', '60%');
  for (const [offset, op] of [[0, 0.45], [0.6, 0.0]]) {
    const s = document.createElementNS(SVG_NS, 'stop');
    s.setAttribute('offset', `${offset * 100}%`);
    s.setAttribute('stop-color', '#ffffff');
    s.setAttribute('stop-opacity', op);
    frameHl.appendChild(s);
  }
  localDefs.appendChild(frameHl);
  // Apply highlight via a clipped rect (clipped to frame path)
  const frameClipId = `frameclip-${Math.floor(Math.random() * 1e9)}`;
  const frameClip = document.createElementNS(SVG_NS, 'clipPath');
  frameClip.setAttribute('id', frameClipId);
  const frameClipPath = document.createElementNS(SVG_NS, 'path');
  frameClipPath.setAttribute('d', frameD);
  frameClip.appendChild(frameClipPath);
  localDefs.appendChild(frameClip);
  const frameHlRect = document.createElementNS(SVG_NS, 'rect');
  frameHlRect.setAttribute('x', fArchX);
  frameHlRect.setAttribute('y', fArchY);
  frameHlRect.setAttribute('width', fArchW);
  frameHlRect.setAttribute('height', groundY - fArchY);
  frameHlRect.setAttribute('fill', `url(#${frameHighlightId})`);
  frameHlRect.setAttribute('clip-path', `url(#${frameClipId})`);
  shapesLayer.appendChild(frameHlRect);
  // Inset shadow on outer edge of the frame
  applyInsetShadow(shapesLayer, frameD, localDefs,
    { color: '#2a2a2a', thickness: frameThickness * 1.2, blur: frameThickness * 0.4, opacity: 0.5 });

  // Inset shadow on the INNER edge of the frame band (where the arch sits).
  // Achieved by stroking the arch path with a thick stroke, clipped to the
  // frame band so only the half outside the arch (in the frame ring) is
  // visible.  This darkens just the inside lip of the frame.
  const innerShadowGroup = document.createElementNS(SVG_NS, 'g');
  innerShadowGroup.setAttribute('clip-path', `url(#${frameClipId})`);
  innerShadowGroup.setAttribute('opacity', 0.55);
  // Use a tiny blur for softness
  const innerBlurId = makeInsetShadowFilter(localDefs, 'frameinner', frameThickness * 0.3);
  innerShadowGroup.setAttribute('filter', `url(#${innerBlurId})`);
  const innerShadowStroke = document.createElementNS(SVG_NS, 'path');
  innerShadowStroke.setAttribute('d', archD);
  innerShadowStroke.setAttribute('fill', 'none');
  innerShadowStroke.setAttribute('stroke', '#2a2a2a');
  innerShadowStroke.setAttribute('stroke-width', frameThickness * 1.0);
  innerShadowStroke.setAttribute('stroke-linejoin', 'round');
  innerShadowGroup.appendChild(innerShadowStroke);
  shapesLayer.appendChild(innerShadowGroup);

  shapesLayer.appendChild(svgPath(frameD,
    { fill: 'none', stroke: CASTLE_STROKE, strokeWidth: LINE_W }));

  door(dlClipId, false);
  door(drClipId, true);

  // Plank dividers — drawn as continuous full-height lines from archY to
  // groundY, anchored at seamX so they align with the wood pattern.  The
  // pattern's vertical dividers were removed because they suffered the same
  // tile-boundary thickness artifacts the bricks did; drawing one continuous
  // line per divider eliminates the issue.  Each line is clipped to the
  // arch silhouette so divisions don't poke past the door edges.
  const plankClipId = `plankclip-${Math.floor(Math.random() * 1e9)}`;
  const plankClip = document.createElementNS(SVG_NS, 'clipPath');
  plankClip.setAttribute('id', plankClipId);
  const plankClipPath = document.createElementNS(SVG_NS, 'path');
  plankClipPath.setAttribute('d', archD);
  plankClip.appendChild(plankClipPath);
  localDefs.appendChild(plankClip);

  // Build all dividers and horizontal joints as a single path so the stroke
  // renders as one pass (consistent thickness, no pattern artifacts).
  const PLANK_W = 6;
  const TILE_H  = 24;
  let plankD = '';
  // Verticals: divider lines at every PLANK_W from seam outward.
  // Track plank center positions so we can draw their horizontal joints.
  const plankCenters = [];   // each: { cx, cy_offset } where cy_offset is the joint stagger
  for (let dx = 0; seamX - dx >= archX - PLANK_W; dx += PLANK_W) {
    const px = seamX - dx;
    plankD += `M ${px} ${archY} L ${px} ${groundY} `;
  }
  for (let dx = PLANK_W; seamX + dx <= archX + archW + PLANK_W; dx += PLANK_W) {
    const px = seamX + dx;
    plankD += `M ${px} ${archY} L ${px} ${groundY} `;
  }
  // Horizontals: each plank gets its own joint y-positions.  Plank index n
  // counted from seamX (n=0 is just left of seam, n=1 just right, etc).
  // Even-indexed planks: joints at viewport y = TILE_H, 2*TILE_H, 3*TILE_H ...
  // Odd-indexed planks: joints at TILE_H/2, 3*TILE_H/2, 5*TILE_H/2 ...
  // (matches the running-bond stagger from the original pattern.)
  function plankJoints(plankLeftX, plankRightX, parity) {
    // parity 0 = joints at TILE_H * k for k = 1, 2, 3...
    // parity 1 = joints at TILE_H * (k + 0.5) for k = 0, 1, 2...
    let d = '';
    const base = parity === 0 ? 0 : TILE_H * 0.5;
    for (let k = 0; ; k++) {
      const jy = base + k * TILE_H + (parity === 0 ? TILE_H : 0);
      // Convert to viewport y by anchoring with seamX-anchored pattern at y=0
      // (no y-translation in patternTransform, so jy IS the viewport y).
      if (jy >= groundY) break;
      if (jy <= archY) continue;
      d += `M ${plankLeftX} ${jy} L ${plankRightX} ${jy} `;
    }
    return d;
  }
  // Iterate planks left of seam (n = -1, -2, ...) and right of seam (n = 0, 1, 2, ...)
  // Plank index n: x range [seamX + n * PLANK_W, seamX + (n+1) * PLANK_W]
  // Parity: ((n % 2) + 2) % 2 — 0 for even n, 1 for odd n.
  // Stop when plank is fully outside the door.
  for (let n = 0; seamX + n * PLANK_W <= archX + archW; n++) {
    const lx = seamX + n * PLANK_W;
    const rx = lx + PLANK_W;
    const parity = ((n % 2) + 2) % 2;
    plankD += plankJoints(lx, rx, parity);
  }
  for (let n = -1; seamX + (n + 1) * PLANK_W >= archX; n--) {
    const lx = seamX + n * PLANK_W;
    const rx = lx + PLANK_W;
    const parity = ((n % 2) + 2) % 2;
    plankD += plankJoints(lx, rx, parity);
  }

  const plankPath = document.createElementNS(SVG_NS, 'path');
  plankPath.setAttribute('d', plankD);
  plankPath.setAttribute('stroke', '#4a3520');
  plankPath.setAttribute('stroke-width', 0.5);
  plankPath.setAttribute('fill', 'none');
  plankPath.setAttribute('clip-path', `url(#${plankClipId})`);
  shapesLayer.appendChild(plankPath);

  // ── Door shadows ──
  // Tunables shared by both shadow systems (inset all-edges + seam linear).
  const DOOR_SHADOW_COLOR   = '#2a1408';
  const DOOR_SHADOW_OPACITY = 0.40;
  // Vertical fade for the seam gradient (chosen values, hard-coded):
  //   fadeEnd    = 0.20 → seam reaches full opacity ~20% down from the top
  //   fadeSpread = 1.00 → fade STARTS at the very top, ramps in continuously
  // The fade STARTS at (fadeEnd - fadeSpread) and ENDS at fadeEnd.  Above
  // fadeStart the gradient is fully hidden.
  const fadeEnd    = 0.20;
  const fadeSpread = 1.00;
  const fadeStart  = Math.max(0, fadeEnd - fadeSpread);

  // 1. Inset shadow extending from ALL edges of the arch silhouette,
  //    matching the window treatment — emphasizes the arched shape from
  //    every edge (curved top, sides, floor).
  applyInsetShadow(
    shapesLayer,
    archD,
    localDefs,
    {
      color:     DOOR_SHADOW_COLOR,
      thickness: archW * 0.22,
      blur:      archW * 0.05,
      opacity:   DOOR_SHADOW_OPACITY,
    }
  );

  // 2. Per-door inner-edge (seam) linear gradient shadows.  Each gradient is
  //    clipped to its door half so it only paints on that door, AND masked
  //    by a vertical fade that hides the gradient near the curved top.
  //    That fade prevents the seam shadow from compounding with the curved-
  //    top inset shadow.
  // Build the mask once — both seam gradients share it.
  const seamFadeMaskId = `seamfade-${Math.floor(Math.random() * 1e9)}`;
  const seamFadeMask = document.createElementNS(SVG_NS, 'mask');
  seamFadeMask.setAttribute('id', seamFadeMaskId);
  seamFadeMask.setAttribute('maskUnits', 'userSpaceOnUse');
  seamFadeMask.setAttribute('x', archX);
  seamFadeMask.setAttribute('y', archY);
  seamFadeMask.setAttribute('width',  archW);
  seamFadeMask.setAttribute('height', archH);
  // Mask gradient: black (hidden) at the very top, white (shown) by
  // archY + archH * DOOR_FADE_END_FRAC, then white all the way down.
  // The longer fade range means the seam shadow ramps in gradually rather
  // than appearing abruptly partway down the door.
  const seamFadeGradId = `seamfadegrad-${Math.floor(Math.random() * 1e9)}`;
  const seamFadeGrad = document.createElementNS(SVG_NS, 'linearGradient');
  seamFadeGrad.setAttribute('id', seamFadeGradId);
  seamFadeGrad.setAttribute('gradientUnits', 'userSpaceOnUse');
  seamFadeGrad.setAttribute('x1', 0); seamFadeGrad.setAttribute('y1', archY);
  seamFadeGrad.setAttribute('x2', 0); seamFadeGrad.setAttribute('y2', archY + archH);
  for (const [offset, color] of [
    [0,           'black'],   // top: hidden
    [fadeStart,   'black'],   // remain hidden up to fadeStart
    [fadeEnd,     'white'],   // visible by fadeEnd
    [1,           'white'],   // bottom: visible
  ]) {
    const s = document.createElementNS(SVG_NS, 'stop');
    s.setAttribute('offset', `${offset * 100}%`);
    s.setAttribute('stop-color', color);
    seamFadeGrad.appendChild(s);
  }
  localDefs.appendChild(seamFadeGrad);
  const seamFadeRect = document.createElementNS(SVG_NS, 'rect');
  seamFadeRect.setAttribute('x', archX);
  seamFadeRect.setAttribute('y', archY);
  seamFadeRect.setAttribute('width',  archW);
  seamFadeRect.setAttribute('height', archH);
  seamFadeRect.setAttribute('fill', `url(#${seamFadeGradId})`);
  seamFadeMask.appendChild(seamFadeRect);
  localDefs.appendChild(seamFadeMask);

  function doorEdgeGradient(idSuffix, x1, y1, x2, y2, halfClipId, opacity, fadeFrac) {
    const lin = document.createElementNS(SVG_NS, 'linearGradient');
    const id = `dooredge-${idSuffix}-${Math.floor(Math.random() * 1e9)}`;
    lin.setAttribute('id', id);
    lin.setAttribute('gradientUnits', 'userSpaceOnUse');
    lin.setAttribute('x1', x1); lin.setAttribute('y1', y1);
    lin.setAttribute('x2', x2); lin.setAttribute('y2', y2);
    // Sharp dark at the edge, fading to clear by `fadeFrac` of the way along
    for (const [offset, op] of [[0, opacity], [fadeFrac, 0]]) {
      const s = document.createElementNS(SVG_NS, 'stop');
      s.setAttribute('offset', `${offset * 100}%`);
      s.setAttribute('stop-color', DOOR_SHADOW_COLOR);
      s.setAttribute('stop-opacity', op);
      lin.appendChild(s);
    }
    localDefs.appendChild(lin);
    const r = document.createElementNS(SVG_NS, 'rect');
    r.setAttribute('x', archX); r.setAttribute('y', archY);
    r.setAttribute('width',  archW);
    r.setAttribute('height', archH);
    r.setAttribute('fill', `url(#${id})`);
    r.setAttribute('clip-path', `url(#${halfClipId})`);
    // Apply the vertical fade mask so the gradient fades out toward the
    // curved-top region (avoids compounding with the inset shadow there).
    r.setAttribute('mask', `url(#${seamFadeMaskId})`);
    shapesLayer.appendChild(r);
  }
  // Left door: seam is on the RIGHT edge of the half.  Gradient runs from
  // seam (dark) leftward (clear).  Spread = 0.20 of arch width — chosen value.
  doorEdgeGradient('l-seam', seamX, 0, seamX - archW * 0.20, 0, dlClipId, DOOR_SHADOW_OPACITY, 1.0);
  // Right door: seam is on the LEFT edge of the half.
  doorEdgeGradient('r-seam', seamX, 0, seamX + archW * 0.20, 0, drClipId, DOOR_SHADOW_OPACITY, 1.0);

  // Outline on top
  shapesLayer.appendChild(svgPath(archD,
    { fill: 'none', stroke: CASTLE_STROKE, strokeWidth: LINE_W }));

  // Gold ring handles — one on each door, positioned near the inner edge
  // (close to the seam) at a comfortable hand height.
  const handleY = groundY - archH * 0.50;
  const handleR = archW * 0.045;
  const handleInset = archW * 0.10;     // distance from seam toward each door's outer edge
  function doorHandle(cx, cy, r) {
    // Thicker gold ring: outer dark-gold stroke, inner highlight stroke
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('cx', cx);
    ring.setAttribute('cy', cy);
    ring.setAttribute('r', r);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#caa030');             // gold body
    ring.setAttribute('stroke-width', r * 0.45);
    shapesLayer.appendChild(ring);
    // Highlight – inner thin lighter ring for a hint of metallic shine
    const hi = document.createElementNS(SVG_NS, 'circle');
    hi.setAttribute('cx', cx);
    hi.setAttribute('cy', cy);
    hi.setAttribute('r', r * 0.85);
    hi.setAttribute('fill', 'none');
    hi.setAttribute('stroke', '#f4d65a');
    hi.setAttribute('stroke-width', r * 0.10);
    shapesLayer.appendChild(hi);
    // Mounting plate: small dark anchor where the ring attaches to the door
    const anchor = document.createElementNS(SVG_NS, 'circle');
    anchor.setAttribute('cx', cx);
    anchor.setAttribute('cy', cy - r);
    anchor.setAttribute('r', r * 0.18);
    anchor.setAttribute('fill', '#8a6f1c');
    shapesLayer.appendChild(anchor);
  }
  doorHandle(seamX - handleInset, handleY, handleR);
  doorHandle(seamX + handleInset, handleY, handleR);

  // Small squares inside the body, flanking the arch.
  // Windows are deep sky blue with a wider-clear-middle "box gradient" cushion
  // shade (darker at all four edges, brighter in the center).  The sill below
  // each window matches the brick color and gets a gentle matching gradient.
  // Sized to match the 20mm icon-tile dimension used everywhere else on the
  // board so the castle visually keys to the same grid as the quadlet rows.
  const sqSize = 20;
  const sqGap = sqSize * 0.18;
  const sqRowY1 = bodyTop + bodyH * 0.30;
  const sqRowY2 = sqRowY1 + sqSize + sqGap;

  const WINDOW_BLUE    = '#3da5e0';            // deep sky blue base
  const WINDOW_OUTLINE = '#0a3a6b';            // matching dark blue outline
  const WINDOW_OPACITY = 0.65;                 // semi-transparent — reveals interior bricks
  // Interior bricks — darker than the outer wall to suggest the inside
  // of the castle is in shadow.
  const INTERIOR_BRICK   = '#5a5550';
  const INTERIOR_GROUT   = '#3a3835';
  const INTERIOR_BRICK_W = 5.5;                // smaller than outer-wall bricks (perspective)
  const INTERIOR_BRICK_H = 3.0;

  // Build an interior-bricks pattern.  Smaller bricks + darker tone
  // suggests we're looking THROUGH the window at a wall some distance
  // inside the castle.
  const intPatId = 'bricks-interior-' + Math.floor(Math.random() * 1e9);
  const intPat = document.createElementNS(SVG_NS, 'pattern');
  intPat.setAttribute('id', intPatId);
  intPat.setAttribute('patternUnits', 'userSpaceOnUse');
  intPat.setAttribute('width',  INTERIOR_BRICK_W);
  intPat.setAttribute('height', INTERIOR_BRICK_H * 2);
  const intBg = document.createElementNS(SVG_NS, 'rect');
  intBg.setAttribute('width',  INTERIOR_BRICK_W);
  intBg.setAttribute('height', INTERIOR_BRICK_H * 2);
  intBg.setAttribute('fill', INTERIOR_BRICK);
  intPat.appendChild(intBg);
  const intMortarD =
    `M 0 0 L ${INTERIOR_BRICK_W} 0 ` +
    `M 0 ${INTERIOR_BRICK_H} L ${INTERIOR_BRICK_W} ${INTERIOR_BRICK_H} ` +
    `M 0 0 L 0 ${INTERIOR_BRICK_H} ` +
    `M ${INTERIOR_BRICK_W/2} ${INTERIOR_BRICK_H} L ${INTERIOR_BRICK_W/2} ${INTERIOR_BRICK_H*2}`;
  const intMortar = document.createElementNS(SVG_NS, 'path');
  intMortar.setAttribute('d', intMortarD);
  intMortar.setAttribute('stroke', INTERIOR_GROUT);
  intMortar.setAttribute('stroke-width', LINE_W * 0.6);
  intMortar.setAttribute('fill', 'none');
  intPat.appendChild(intMortar);
  localDefs.appendChild(intPat);

  const innerSqOpts = { fill: WINDOW_BLUE, stroke: WINDOW_OUTLINE, strokeWidth: LINE_W, radius: 0.6 };

  // Sill: thicker than before (touches the next row's window top to hide
  // distracting brick between rows), filled with brick gray.
  const sillExtend = sqSize * 0.08;            // overhang on each side
  const sillH      = sqGap;                    // = full gap between rows
  function placeWindow(sx, sy) {
    // 1. INTERIOR BRICKS — darker bricks visible through the window,
    //    suggesting the wall on the other side.  Draw a filled rect
    //    using the interior brick pattern, contained within the window
    //    bounds (rounded corners match the window radius).
    shapesLayer.appendChild(svgPath(
      roundedRectPath(sx, sy, sqSize, sqSize, 0.6),
      { fill: `url(#${intPatId})`, stroke: 'none' }
    ));
    // 2. SEMI-TRANSPARENT GLASS — sky-blue overlay at ~65% opacity, so
    //    the interior bricks ghost through.  Drawn as the standard
    //    window square but with reduced fill opacity.
    const glassRect = svgRect(sx, sy, sqSize, sqSize, WINDOW_BLUE, 0.6);
    glassRect.setAttribute('opacity', WINDOW_OPACITY);
    shapesLayer.appendChild(glassRect);
    // 3. Window outline (full opacity) — sits on top of the glass
    shapesLayer.appendChild(svgPath(
      roundedRectPath(sx, sy, sqSize, sqSize, 0.6),
      { fill: 'none', stroke: WINDOW_OUTLINE, strokeWidth: LINE_W }
    ));
    // 4. Inset shadow gives a soft frame of darkening just inside the
    //    window edge.
    applyInsetShadow(
      shapesLayer,
      roundedRectPath(sx, sy, sqSize, sqSize, 0.6),
      localDefs,
      { color: '#0a3a6b', thickness: sqSize * 0.22, blur: sqSize * 0.08, opacity: 0.85 }
    );

    // Sill — gray rectangle bridging the gap to the next row.
    const sillX = sx - sillExtend;
    const sillY = sy + sqSize;
    const sillW = sqSize + sillExtend * 2;
    shapesLayer.appendChild(svgRect(sillX, sillY, sillW, sillH, BRICK_FILL, 0.3));
    // Gentle inset shadow on the sill — small region, subtle
    applyInsetShadow(
      shapesLayer,
      roundedRectPath(sillX, sillY, sillW, sillH, 0.3),
      localDefs,
      { color: '#3a3a3a', thickness: sillH * 0.4, blur: sillH * 0.15, opacity: 0.35 }
    );
    // Thin outline
    shapesLayer.appendChild(svgPath(roundedRectPath(sillX, sillY, sillW, sillH, 0.3),
      { fill: 'none', stroke: CASTLE_STROKE, strokeWidth: LINE_W }));
  }

  // Left set: 2x2 plain
  const leftStartX = bodyX + bodyW * 0.07;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      placeWindow(
        leftStartX + c * (sqSize + sqGap),
        (r === 0 ? sqRowY1 : sqRowY2),
      );
    }
  }

  // Right set: 2x2 (left column plain, right column with "4/5" labels)
  const rightStartX = bodyX + bodyW - bodyW * 0.07 - (sqSize * 2 + sqGap);
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const sx = rightStartX + c * (sqSize + sqGap);
      const sy = (r === 0 ? sqRowY1 : sqRowY2);
      placeWindow(sx, sy);
      if (c === 1) {
        edgeNumber(sx + sqSize / 2, sy + sqSize / 2, '4/5', '#ffffff', sqSize * 0.55,
                   'middle', { color: WINDOW_OUTLINE, width: LINE_W * 2 });
      }
    }
  }
}

// ─────────────────────────────────────────────────────────────────────
// COMPOSE THE BOARD
// ─────────────────────────────────────────────────────────────────────
function render() {
  __tintRegistry = null;
  clear();
  ensureSvgFont();
  setupLayers();

  // Layout in mm
  const W = 304.8;          // poster width (12 in)
  const H = 457.2;          // poster height (18 in)
  const sq = 20;            // square size (20mm as specified)
  const quadCount = 5;
  const sectionCount = 4;
  const numFontSize = 24;

  // Quadlet rows + zigzag banners share one (wider) content area.  This is what
  // gives the quadlets enough breathing room to read as separate clusters.
  const contentInset = 30;
  const contentX = contentInset;
  const contentW = W - contentInset * 2;

  // Castle is narrower than the content area — only the castle shrinks to make
  // room for the wider "10" labels, the quadlets/banners are unaffected.
  const castleInset = 38;
  const castleX = castleInset;
  const castleW = W - castleInset * 2;

  // Left numbers are RIGHT-aligned with their right edges anchored just outside
  // the content area; right numbers stay right-aligned at the paper edge.
  // Both anchors are right edges of the text — wider numbers like "10" extend
  // further leftward into the margin.
  const numEdgePad = 4;                 // gap between number's right edge and content
  const leftNumX   = contentInset - numEdgePad;
  const rightNumX  = W - 6;             // 6mm from the right paper edge

  // ── Castle (positioned near top of page; banner overlaps it like a
  //    mounted sign).  Drawn FIRST so the title banner renders on top.
  const castleH = 95;
  const brickH = castleH * 0.045;     // matches merlonH inside castle()
  const topMargin = 6 + brickH;       // move castle DOWN one brick height
  castle(castleX, topMargin, castleW, castleH);
  const castleMidY = topMargin + castleH / 2;
  // The left "10" anchors to the CASTLE's left edge (not the wider content
  // area), so it has the same 4mm gap to the castle that "8"/"6"/etc. have to
  // their quadlet rows.  The right "10" stays at the paper-edge anchor.
  const castleLeftNumX = castleInset - numEdgePad;
  edgeNumber(castleLeftNumX, castleMidY, '10', '#111', numFontSize, 'end');
  edgeNumber(rightNumX,      castleMidY, '10', '#111', numFontSize, 'end');

  // ── Title banner — drawn AFTER the castle so it overlays the castle wall.
  //    Positioned to hang across the upper portion of the castle like a
  //    mounted sign / pennant.  Centered horizontally; vertically the
  //    banner straddles the castle's crenellation line.
  const titleH       = 18;     // banner height in mm (overall, not counting tails)
  const titleW       = 130;    // banner width — narrower than castle
  // Vertical position: banner moved UP by one brick height from its
  // previous reference (castle-top + 4mm) so it floats higher relative
  // to the castle wall — more of the banner sits ABOVE the merlon line.
  const titleTop     = topMargin + 4 - brickH * 2;     // up by 2*brickH
  const titleX       = (W - titleW) / 2;
  const titleTailLen = 10;     // how far each pointed tail extends past the body
  const titleNotch   = 6;      // depth of the inward V-notch between tails
  const BANNER_FILL    = '#5e2a8a';   // medieval purple
  const BANNER_STROKE  = '#ffffff';   // white border
  const BANNER_SHADOW  = '#2a0a44';   // dark purple inner fold shade

  // Banner body extends from titleX..titleX+titleW; the rectangular middle
  // sits inset from each end by `titleTailLen` so the pointed tails extend
  // OUT past the body.  At each end:
  //   * top tail tip = (body-edge ± tailLen, top)
  //   * bottom tail tip = (body-edge ± tailLen, bottom)
  //   * inward notch tip = (body-edge ∓ notch, mid)
  const tT = titleTop;
  const tB = titleTop + titleH;
  const tM = titleTop + titleH / 2;
  const tL = titleX;
  const tR = titleX + titleW;
  // Body x-range (rectangular middle, between the tail-tip x-positions)
  const bodyL = tL + titleTailLen;
  const bodyR = tR - titleTailLen;
  // Path: start at top-left tail tip, around clockwise.
  const bannerPath =
    `M ${tL} ${tT} ` +                      // top-left tail tip
    `L ${tR} ${tT} ` +                      // → top-right tail tip
    `L ${bodyR + titleNotch} ${tM} ` +      // ↘ inward to right notch tip
    `L ${tR} ${tB} ` +                      // ↘ to bottom-right tail tip
    `L ${tL} ${tB} ` +                      // ← along bottom
    `L ${bodyL - titleNotch} ${tM} ` +      // ↗ inward to left notch tip
    `Z`;                                    // back to start
  // Subtle drop shadow under the banner so it reads as a separate object
  // floating above the castle wall.
  const titleShadowId = 'title-banner-shadow';
  if (!document.getElementById(titleShadowId)) {
    const f = document.createElementNS(SVG_NS, 'filter');
    f.setAttribute('id', titleShadowId);
    f.setAttribute('x', '-10%'); f.setAttribute('y', '-10%');
    f.setAttribute('width', '120%'); f.setAttribute('height', '140%');
    const off = document.createElementNS(SVG_NS, 'feOffset');
    off.setAttribute('in', 'SourceAlpha');
    off.setAttribute('dx', '0.4'); off.setAttribute('dy', '0.8');
    off.setAttribute('result', 'offA');
    f.appendChild(off);
    const blur = document.createElementNS(SVG_NS, 'feGaussianBlur');
    blur.setAttribute('in', 'offA');
    blur.setAttribute('stdDeviation', '0.6');
    blur.setAttribute('result', 'blurA');
    f.appendChild(blur);
    const ct = document.createElementNS(SVG_NS, 'feComponentTransfer');
    ct.setAttribute('in', 'blurA');
    const fa = document.createElementNS(SVG_NS, 'feFuncA');
    fa.setAttribute('type', 'linear'); fa.setAttribute('slope', '0.45');
    ct.appendChild(fa);
    ct.setAttribute('result', 'sh');
    f.appendChild(ct);
    const merge = document.createElementNS(SVG_NS, 'feMerge');
    for (const src of ['sh', 'SourceGraphic']) {
      const n = document.createElementNS(SVG_NS, 'feMergeNode');
      n.setAttribute('in', src);
      merge.appendChild(n);
    }
    f.appendChild(merge);
    board.querySelector('defs').appendChild(f);
  }
  // Banner fill + WHITE border
  const bannerEl = svgPath(bannerPath, {
    fill: BANNER_FILL,
    stroke: BANNER_STROKE,
    strokeWidth: LINE_W * 1.5,
  });
  bannerEl.setAttribute('filter', `url(#${titleShadowId})`);
  shapesLayer.appendChild(bannerEl);
  // Title text — Kranky, sized to fit the banner height, centered horizontally
  // within the rectangular body (not extending into the tails).  White text
  // with a subtle dark-purple stroke outline for readability.
  edgeNumber((bodyL + bodyR) / 2, tM, 'Muscat', '#ffffff',
             titleH * 0.85, 'middle',
             { color: BANNER_SHADOW, width: LINE_W });

  // ── Four sections of [quadlet row + terrain banner]
  // Castle moved up + smaller bottom margin + smaller inter-section gap
  // gives each section much more vertical room → bigger terrain banners.
  const sectionTopY = topMargin + castleH + 4;
  const remainingH  = H - sectionTopY - 4;   // tighter bottom margin
  const sectionH    = remainingH / sectionCount;

  const quadletNums = ['8', '6', '4', '2'];
  const bannerNums  = ['-4', '-3', '-2', '-1'];
  // Per-section terrain colors (top → bottom: -4 lava, -3 sand, -2 sea, -1 grass)
  const bannerColors = [
    { fill: '#e8521f', stroke: '#7a1a05' },   // lava red / dark magma
    { fill: '#e8c773', stroke: '#7a5a2a' },   // sand yellow / dirt
    { fill: '#3a91c2', stroke: '#0e3450' },   // sea blue / dark ocean
    { fill: '#6fbf3f', stroke: '#1f4a14' },   // grass green / dark green
  ];

  for (let s = 0; s < sectionCount; s++) {
    const sy = sectionTopY + s * sectionH;
    const quadH = sq * 2 + sq * 0.18;
    const bannerY = sy + quadH + 3;
    const bannerH = sectionH - quadH - 6;

    // Quadlet row uses the BANNER STROKE color as the square fill (the
    // darker shade in each section's theme).  Icons / outlines are painted
    // in papyrus so they pop uniformly across every section as one cohesive
    // icon family.  Arrows keep the per-section stroke color so they remain
    // visible against the papyrus background between squares (and they
    // double as a subtle terrain-color cue).
    const PAPYRUS = '#f5e8c4';
    const rowTheme = {
      squareFill:  bannerColors[s].stroke,
      iconColor:   PAPYRUS,
      outline:     PAPYRUS,
      arrowColor:  bannerColors[s].stroke,
    };
    quadletRow(contentX, sy, sq, quadCount, contentW, rowTheme);
    terrainBanner(s, contentX, bannerY, contentW, bannerH,
                  bannerColors[s].fill, bannerColors[s].stroke);

    // Edge labels — black for quadlet rows, red for banners.  All same size.
    const quadMidY   = sy + quadH / 2;
    const bannerMidY = bannerY + bannerH / 2;
    edgeNumber(leftNumX,  quadMidY,   quadletNums[s], '#111',     numFontSize, 'end');
    edgeNumber(rightNumX, quadMidY,   quadletNums[s], '#111',     numFontSize, 'end');
    edgeNumber(leftNumX,  bannerMidY, bannerNums[s],  '#E31D1D',  numFontSize, 'end');
    edgeNumber(rightNumX, bannerMidY, bannerNums[s],  '#E31D1D',  numFontSize, 'end');
  }
}

// ─────────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────────
const seedBtn = document.getElementById('reseed');
const exportBtn = document.getElementById('export-png');
const gFreqEl  = document.getElementById('grain-freq');
const gScaleEl = document.getElementById('grain-scale');
const gFreqVal  = document.getElementById('grain-freq-val');
const gScaleVal = document.getElementById('grain-scale-val');

seedBtn.addEventListener('click', () => { G.seed = Math.floor(Math.random() * 100000); render(); });

function fmt(v) { return v.toFixed(2); }

// Grain sliders update the live filter attributes directly — cheap, doesn't
// re-shuffle the wobble, just retunes the noise displacement.
gFreqEl.addEventListener('input', () => {
  G.grainFreq = parseFloat(gFreqEl.value);
  gFreqVal.textContent = fmt(G.grainFreq);
  document.getElementById('grain-turb')?.setAttribute('baseFrequency', G.grainFreq);
});
gScaleEl.addEventListener('input', () => {
  G.grainScale = parseFloat(gScaleEl.value);
  gScaleVal.textContent = fmt(G.grainScale);
  document.getElementById('grain-disp')?.setAttribute('scale', G.grainScale);
});

// Export the SVG as a 12×18 inch PNG at the requested DPI.
// The SVG is rasterized through a <canvas>, which gives a print-ready bitmap.
async function exportPng(dpi = 300) {
  const widthIn = 12, heightIn = 18;
  const W = Math.round(widthIn * dpi);
  const H = Math.round(heightIn * dpi);

  // Make sure the embedded font has fully loaded before serializing
  await document.fonts.ready;

  // Clone the SVG so we can stamp explicit width/height without disturbing the
  // live one; the inline style + base64 font ride along automatically.
  const clone = board.cloneNode(true);
  clone.setAttribute('width',  widthIn  + 'in');
  clone.setAttribute('height', heightIn + 'in');
  clone.setAttribute('xmlns', SVG_NS);

  const xml  = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url  = URL.createObjectURL(blob);

  exportBtn.disabled = true;
  exportBtn.textContent = 'rendering…';
  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload  = resolve;
      img.onerror = () => reject(new Error('SVG → image load failed'));
      img.src     = url;
    });

    const canvas = document.createElement('canvas');
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f5e8c4';   // papyrus — matches the on-screen --paper
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);

    const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const a = document.createElement('a');
    a.download = `board-12x18-${dpi}dpi.png`;
    a.href     = URL.createObjectURL(pngBlob);
    a.click();
    URL.revokeObjectURL(a.href);
  } finally {
    URL.revokeObjectURL(url);
    exportBtn.disabled = false;
    exportBtn.textContent = 'export 12×18 png · 300dpi';
  }
}
exportBtn.addEventListener('click', () => exportPng(300));

render();
</script>
